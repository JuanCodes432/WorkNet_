<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crea tu perfil profesional en WorkNet.">
  <title>Crear perfil · WorkNet</title>
  <link rel="stylesheet" href="../../css/navegacion.css">
  <link rel="stylesheet" href="../../css/perfil-profesional/Styles_Crear_Perfil.css">
</head>
<body>
  <nav class="worknet-nav" aria-label="Navegación principal">
    <a class="worknet-nav__brand" href="/">WorkNet</a>
    <div class="worknet-nav__links">
      <a href="/">Inicio</a>
      <a href="/historial-servicios" data-worknet-session>Historial de servicios</a>
      <a href="/Perfil%20Profesional/Crear_Perfil.html" data-worknet-guest aria-current="page">Crear perfil</a>
      <a href="/Perfil%20Profesional/Iniciar_Sesion.html" data-worknet-guest>Iniciar sesión</a>
      <a href="/Perfil%20Profesional/Perfil_Profesional.html" data-worknet-session>Perfil</a>
      <a href="/Perfil%20Profesional/Iniciar_Sesion.html" data-worknet-logout>Cerrar sesión</a>
    </div>
  </nav>

  <main class="create-page">
    <section class="create-card" aria-labelledby="create-title">
      <header class="create-card__header">
        <p class="create-card__eyebrow">Únete a WorkNet</p>
        <h1 id="create-title">Crear perfil</h1>
        <p>Completa tus datos para crear tu perfil en WorkNet.</p>
      </header>

      <form id="create-profile-form" class="create-form" novalidate>
        <p class="form-message" id="form-message" role="alert" aria-live="polite" hidden></p>

        <div class="form-grid">
          <div class="form-field">
            <label for="profile-name">Nombre</label>
            <input id="profile-name" name="name" type="text" autocomplete="name"
              maxlength="120" required aria-describedby="name-error">
            <span class="field-error" id="name-error" role="alert"></span>
          </div>

          <div class="form-field">
            <label for="profile-profession">Profesión</label>
            <input id="profile-profession" name="profession" type="text"
              autocomplete="organization-title" maxlength="160" required
              aria-describedby="profession-error">
            <span class="field-error" id="profession-error" role="alert"></span>
          </div>

          <div class="form-field">
            <label for="profile-city">Ciudad</label>
            <select id="profile-city" name="city" autocomplete="address-level2" required
              aria-describedby="city-error">
              <option value="">Selecciona una ciudad</option>
            </select>
            <span class="field-error" id="city-error" role="alert"></span>
          </div>

          <div class="form-field">
            <label for="profile-university">Universidad</label>
            <input id="profile-university" name="university" type="text"
              autocomplete="organization" maxlength="200" required
              aria-describedby="university-error">
            <span class="field-error" id="university-error" role="alert"></span>
          </div>

          <div class="form-field form-field--full">
            <label for="account-email">Correo electrónico</label>
            <input id="account-email" name="email" type="email" autocomplete="email"
              maxlength="254" required aria-describedby="email-error">
            <span class="field-error" id="email-error" role="alert"></span>
          </div>

          <div class="form-field">
            <label for="account-password">Contraseña</label>
            <input id="account-password" name="password" type="password"
              autocomplete="new-password" minlength="12" maxlength="1024" required
              aria-describedby="password-hint password-error">
            <span class="field-hint" id="password-hint">Debe tener al menos 12 caracteres.</span>
            <span class="field-error" id="password-error" role="alert"></span>
          </div>

          <div class="form-field">
            <label for="confirm-password">Confirmar contraseña</label>
            <input id="confirm-password" name="confirm-password" type="password"
              autocomplete="new-password" minlength="12" maxlength="1024" required
              aria-describedby="confirm-password-error">
            <span class="field-error" id="confirm-password-error" role="alert"></span>
          </div>
        </div>

        <button class="create-button" id="create-submit" type="submit">Crear perfil</button>
      </form>
    </section>
  </main>
  <script src="../../js/navegacion_cuenta.js" defer></script>
  <script src="../../js/perfil-profesional/Java_Crear_Perfil.js" defer></script>
</body>
</html>
