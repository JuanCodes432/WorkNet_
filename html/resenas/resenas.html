<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reseñas de clientes · Worknet</title>

  <!-- Tipografía del diseño de Figma: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/pagina-resenas/resenas.css">
</head>
<body>

  <div class="app-shell">

    <!-- Botón de menú (solo se ve en celular) -->
    <button class="mobile-menu-button" id="btn-menu" type="button" aria-label="Abrir menú" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- ============ BARRA LATERAL ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-content">
        <!-- Logo: solo el nombre, en el azul de la marca (variable --marca en el CSS) -->
        <a class="worknet-logo" href="#inicio" data-prevenir>WORKNET</a>

        <!-- Tarjeta de la cuenta -->
        <section class="account-card">
          <span class="avatar-fallback large">
            <img class="icon" src="../../img/iconos/usuario-grande.svg" alt="">
          </span>
          <strong>Pepito perez</strong>
          <span>Ingeniero de Software</span>
          <span class="inline-location">
            <img class="icon" src="../../img/iconos/ubicacion-11.svg" alt=""> Popayán · Cauca
          </span>
          <a href="#universidad" data-prevenir>Universidad del Cauca</a>
        </section>

        <!-- Navegación principal -->
        <nav class="main-nav" aria-label="Navegación principal">
          <button type="button" data-aviso="Abriendo Inicio">
            <img class="icon" src="../../img/iconos/inicio.svg" alt=""> <span>Inicio</span>
          </button>
          <button type="button" data-aviso="Abriendo Mensajes">
            <img class="icon" src="../../img/iconos/mensajes.svg" alt=""> <span>Mensajes</span>
            <img class="icon notification-dot" src="../../img/iconos/punto-novedades.svg" alt="">
          </button>
          <button type="button" data-aviso="Abriendo Mi perfil">
            <img class="icon" src="../../img/iconos/mi-perfil.svg" alt=""> <span>Mi perfil</span>
          </button>
        </nav>

        <!-- Actividad -->
        <section class="activity">
          <span class="eyebrow">ACTIVIDAD</span>
          <button type="button" data-aviso="Abriendo Generar recibo">
            <img class="icon" src="../../img/iconos/grafica.svg" alt=""> <span>Generar recibo</span>
          </button>
        </section>
      </div>
    </aside>

    <!-- ============ ÁREA PRINCIPAL ============ -->
    <main class="main-area">

      <!-- Barra superior -->
      <header class="topbar">
        <div class="breadcrumb">
          <span>Worknet</span>
          <img class="icon" src="../../img/iconos/chevron-derecha.svg" alt="">
          <strong>Reseñas de clientes</strong>
        </div>

        <div class="account-actions">
          <button class="location-button" type="button" data-aviso="Zona: Popayán, Cauca">
            <img class="icon" src="../../img/iconos/ubicacion-16.svg" alt="">
            <span>Popayán, Cauca</span>
            <img class="icon" src="../../img/iconos/chevron-abajo-13.svg" alt="">
          </button>
          <span class="top-separator"></span>
          <button class="icon-button" type="button" aria-label="Notificaciones" data-aviso="No tienes notificaciones nuevas">
            <img class="icon" src="../../img/iconos/campana.svg" alt="">
          </button>
          <button class="mini-avatar" type="button" aria-label="Cuenta" data-aviso="Opciones de cuenta">
            <img class="icon" src="../../img/iconos/usuario-pequeno.svg" alt="">
          </button>
          <img class="icon" src="../../img/iconos/chevron-abajo-14.svg" alt="">
        </div>
      </header>

      <div class="page">

        <!-- Título de la página -->
        <header class="page-heading">
          <h1>Reseñas de clientes</h1>
          <p>Experiencias reales para elegir con confianza.</p>
        </header>

        <div class="content-grid">

          <!-- Columna izquierda: el profesional -->
          <aside class="professional-column">

            <section class="professional-card">
              <img class="professional-photo" src="../../img/fotos/carlos-gomez.jpg" alt="Carlos Gómez">

              <div class="professional-identity">
                <div class="verified-name">
                  <h2>Carlos Gómez</h2>
                  <img class="icon" src="../../img/iconos/verificado.svg" alt="Perfil verificado">
                </div>
                <a href="#plomero" data-prevenir>Plomero</a>
                <span class="inline-location">
                  <img class="icon" src="../../img/iconos/ubicacion-13.svg" alt=""> Popayán, Cauca
                </span>
              </div>

              <div class="card-separator"></div>

              <div class="rating-row">
                <span class="stars" id="estrellas-perfil" aria-label="0 de 5 estrellas">
                  <span class="star-empty">★</span><span class="star-empty">★</span><span class="star-empty">★</span><span class="star-empty">★</span><span class="star-empty">★</span>
                </span>
                <strong id="promedio-perfil">0.0/5</strong>
              </div>

              <button class="button secondary" type="button" data-aviso="Abriendo el perfil profesional de Carlos Gómez">
                Ver perfil profesional
              </button>
