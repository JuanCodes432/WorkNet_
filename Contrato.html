<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar recibo</title>
    <link rel="stylesheet" href="/css/GenerarRecibo.css">
</head>
<body>
    <div class="page-container">
        <main class="contenedor-principal">
            <section class="contenedor-formulario">
                <div class="encabezado">
                    <div>
                        <h1>Generar recibo</h1>
                    </div>
                </div>

                <div class="recibo-preview">
                    <div class="datos-recibo">
                        <div class="dato-recibo">
                            <label>CLIENTE</label>
                            <p id="Pcliente">?</p>
                        </div>

                        <div class="dato-recibo">
                            <label>PROFESIONAL</label>
                            <p id="Pprofesional">?</p>
                        </div>

                        <div class="dato-recibo">
                            <label>SERVICIO</label>
                            <p id="Pservicio">?</p>
                        </div>

                        <div class="dato-recibo">
                            <label>ALCANCE</label>
                            <p id="Palcance">?</p>
                        </div>

                        <div class="dato-recibo">
                            <label>FECHA DEL SERVICIO</label>
                            <p id="PfechaServicio">?</p>
                        </div>

                        <div class="dato-recibo">
                            <label>HORA</label>
                            <p id="Phora">?</p>
                        </div>

                        <div class="dato-recibo">
                            <label>LUGAR DEL SERVICIO</label>
                            <p id="Plugar">?</p>
                        </div>

                        <div class="dato-recibo">
                            <label>IMPORTE</label>
                            <p id="Pimporte">0</p>
                        </div>

                        <div class="dato-recibo">
                            <label>CONDICIONES ACORDADAS</label>
                            <p id="Pcondiciones"></p>
                        </div>

                        <hr>

                        <div class="advertencia-recibo">
                            <strong>Este documento no es un comprobante de pago.</strong>

                            <p>
                                Registra ?nicamente las condiciones del servicio.
                                No acredita entrega de dinero ni reemplaza una factura.
                                Su generaci?n no implica la aceptaci?n de la otra parte.
                            </p>
                        </div>
                    </div>

                    <input type="button" value="? Exportar a PDF"
                        id="descargar" onclick="descargarRecibo()">
                </div>
            </section>
        </main>
    </div>

    <script src="/js/GenerarRecibo.js"></script>
</body>
</html>
